apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: leaderboard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hameed-alahmadi/leaderboard-platform.git
    path: k8s
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true                   # delete things you removed from git
      selfHeal: true                # undo manual changes to match git