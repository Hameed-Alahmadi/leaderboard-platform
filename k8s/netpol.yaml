# 1) deny all incoming traffic to pods in this namespace…
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress }
spec:
  podSelector: {}          # every pod
  policyTypes: [Ingress]
---
# 2) …except: the db accepts connections from app pods on 5432
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-app-to-db }
spec:
  podSelector: { matchLabels: { app: db } }
  ingress:
    - from:
        - podSelector: { matchLabels: { app: app } }
      ports:
        - port: 5432